name: React CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "23rd sept/package-lock.json"

      - name: Install dependencies
        working-directory: "./23rd sept"
        run: npm ci

      - name: Build project
        working-directory: "./23rd sept"
        run: npm run build
