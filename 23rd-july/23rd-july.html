<!DOCTYPE html>
<head>
    <title>Json Data Transfer</title>
</head>
<body>
    <h2>Json Data Transfer example</h2>
    <button onclick="sendData()">Send Json Data</button>
    <p id="p1"></p>
    <script>
        function sendData()
        {
            let student={
            id:1,
            name:"Harini", 
            dept:"computer science with ai",


            };
            let jsonString=JSON.stringify(student);
            document.getElementById("p1").innerHTML="<b>JSON Data</b><br><br>"+jsonString+"<br><br>";
            //convert to object
            
            let serverResponse='{"status":"Success","message":"data received"}';
            let responseObject=JSON.parse(serverResponse);
            document.getElementById("p1").innerHTML+="<b>Server Response:"+"Status:"+responseObject.status+"<br>"+"Message:"+responseObject.message;

        }
    </script>
</body>
